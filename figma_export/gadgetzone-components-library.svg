<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2200" width="1200" height="2200" fill="none">
  <defs>
    <linearGradient id="compBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="compCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="compCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#162032"/>
      <stop offset="100%" stop-color="#111927"/>
    </linearGradient>
  </defs>

  <style>
    .font-jakarta { font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif; }
    .font-inter { font-family: 'Inter', -apple-system, sans-serif; }
    .bold { font-weight: 700; }
    .extrabold { font-weight: 800; }
    .semibold { font-weight: 600; }
    .regular { font-weight: 400; }
  </style>

  <!-- Sheet Canvas -->
  <rect width="1200" height="2200" fill="#0b0f19"/>

  <!-- Title & Specs Header -->
  <g transform="translate(60, 50)">
    <rect width="1080" height="100" rx="16" fill="#162032" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="32" y="44" fill="#ffffff" class="font-jakarta extrabold" font-size="24">GadgetZone – Master Figma Component Library &amp; Tokens</text>
    <text x="32" y="74" fill="#94a3b8" class="font-inter regular" font-size="14">Reusable Master Components, Variants, Color Tokens, and Auto Layout Specifications</text>
    <rect x="920" y="32" width="124" height="34" rx="17" fill="#2563eb" fill-opacity="0.2" stroke="#60a5fa" stroke-opacity="0.4"/>
    <text x="982" y="54" fill="#93c5fd" class="font-jakarta bold" font-size="12" text-anchor="middle">v2.4 Ready</text>
  </g>

  <!-- Section 1: Color Tokens Palette -->
  <g transform="translate(60, 190)">
    <text x="0" y="0" fill="#60a5fa" class="font-jakarta bold" font-size="14" letter-spacing="1">01 / COLOR TOKENS</text>
    <text x="0" y="26" fill="#ffffff" class="font-jakarta bold" font-size="20">Shared Color Styles</text>

    <g transform="translate(0, 45)">
      <!-- Swatch 1 -->
      <g transform="translate(0, 0)">
        <rect width="120" height="80" rx="12" fill="#101828" stroke="#ffffff" stroke-opacity="0.2"/>
        <text x="0" y="105" fill="#ffffff" class="font-jakarta bold" font-size="13">Dark Navy</text>
        <text x="0" y="123" fill="#94a3b8" class="font-inter regular" font-size="11">#101828</text>
      </g>
      <!-- Swatch 2 -->
      <g transform="translate(138, 0)">
        <rect width="120" height="80" rx="12" fill="#2563EB"/>
        <text x="0" y="105" fill="#ffffff" class="font-jakarta bold" font-size="13">Electric Blue</text>
        <text x="0" y="123" fill="#94a3b8" class="font-inter regular" font-size="11">#2563EB</text>
      </g>
      <!-- Swatch 3 -->
      <g transform="translate(276, 0)">
        <rect width="120" height="80" rx="12" fill="#06B6D4"/>
        <text x="0" y="105" fill="#ffffff" class="font-jakarta bold" font-size="13">Tech Cyan</text>
        <text x="0" y="123" fill="#94a3b8" class="font-inter regular" font-size="11">#06B6D4</text>
      </g>
      <!-- Swatch 4 -->
      <g transform="translate(414, 0)">
        <rect width="120" height="80" rx="12" fill="#FFFFFF"/>
        <text x="0" y="105" fill="#ffffff" class="font-jakarta bold" font-size="13">Pure White</text>
        <text x="0" y="123" fill="#94a3b8" class="font-inter regular" font-size="11">#FFFFFF</text>
      </g>
      <!-- Swatch 5 -->
      <g transform="translate(552, 0)">
        <rect width="120" height="80" rx="12" fill="#162032" stroke="#ffffff" stroke-opacity="0.2"/>
        <text x="0" y="105" fill="#ffffff" class="font-jakarta bold" font-size="13">Card Surface</text>
        <text x="0" y="123" fill="#94a3b8" class="font-inter regular" font-size="11">#162032</text>
      </g>
      <!-- Swatch 6 -->
      <g transform="translate(690, 0)">
        <rect width="120" height="80" rx="12" fill="#94A3B8"/>
        <text x="0" y="105" fill="#ffffff" class="font-jakarta bold" font-size="13">Slate Gray</text>
        <text x="0" y="123" fill="#94a3b8" class="font-inter regular" font-size="11">#94A3B8</text>
      </g>
      <!-- Swatch 7 -->
      <g transform="translate(828, 0)">
        <rect width="120" height="80" rx="12" fill="#10B981"/>
        <text x="0" y="105" fill="#ffffff" class="font-jakarta bold" font-size="13">Emerald Success</text>
        <text x="0" y="123" fill="#94a3b8" class="font-inter regular" font-size="11">#10B981</text>
      </g>
      <!-- Swatch 8 -->
      <g transform="translate(966, 0)">
        <rect width="120" height="80" rx="12" fill="#EF4444"/>
        <text x="0" y="105" fill="#ffffff" class="font-jakarta bold" font-size="13">Discount Red</text>
        <text x="0" y="123" fill="#94a3b8" class="font-inter regular" font-size="11">#EF4444</text>
      </g>
    </g>
  </g>

  <!-- Section 2: Typography Styles -->
  <g transform="translate(60, 390)">
    <text x="0" y="0" fill="#60a5fa" class="font-jakarta bold" font-size="14" letter-spacing="1">02 / TYPOGRAPHY TOKENS</text>
    <text x="0" y="26" fill="#ffffff" class="font-jakarta bold" font-size="20">Shared Typography Hierarchy (Plus Jakarta Sans)</text>

    <g transform="translate(0, 50)">
      <line x1="0" y1="0" x2="1080" y2="0" stroke="#ffffff" stroke-opacity="0.1"/>
      <!-- Row 1 -->
      <text x="0" y="32" fill="#60a5fa" class="font-jakarta bold" font-size="13">Display / Hero (56px)</text>
      <text x="250" y="36" fill="#ffffff" class="font-jakarta extrabold" font-size="34">Future of Smart Tech</text>
      <text x="850" y="34" fill="#94a3b8" class="font-inter regular" font-size="13">56px / Line Height: 1.15 / Bold 800</text>
      <line x1="0" y1="52" x2="1080" y2="52" stroke="#ffffff" stroke-opacity="0.08"/>

      <!-- Row 2 -->
      <text x="0" y="84" fill="#60a5fa" class="font-jakarta bold" font-size="13">Section H2 (32px)</text>
      <text x="250" y="86" fill="#ffffff" class="font-jakarta bold" font-size="24">Featured Smart Gadgets</text>
      <text x="850" y="84" fill="#94a3b8" class="font-inter regular" font-size="13">32px / Line Height: 1.25 / Bold 700</text>
      <line x1="0" y1="104" x2="1080" y2="104" stroke="#ffffff" stroke-opacity="0.08"/>

      <!-- Row 3 -->
      <text x="0" y="136" fill="#60a5fa" class="font-jakarta bold" font-size="13">Card H3 (22px)</text>
      <text x="250" y="136" fill="#ffffff" class="font-jakarta bold" font-size="18">Smartwatch Pro (Gen 4)</text>
      <text x="850" y="136" fill="#94a3b8" class="font-inter regular" font-size="13">22px / Line Height: 1.35 / SemiBold 600</text>
      <line x1="0" y1="156" x2="1080" y2="156" stroke="#ffffff" stroke-opacity="0.08"/>

      <!-- Row 4 -->
      <text x="0" y="188" fill="#60a5fa" class="font-jakarta bold" font-size="13">Body Medium (15px)</text>
      <text x="250" y="188" fill="#cbd5e1" class="font-inter regular" font-size="15">Explore the latest gadgets and accessories designed for life.</text>
      <text x="850" y="188" fill="#94a3b8" class="font-inter regular" font-size="13">15px / Line Height: 1.55 / Regular 400</text>
      <line x1="0" y1="208" x2="1080" y2="208" stroke="#ffffff" stroke-opacity="0.08"/>
    </g>
  </g>

  <!-- Section 3: Master Component - Button -->
  <g transform="translate(60, 680)">
    <text x="0" y="0" fill="#60a5fa" class="font-jakarta bold" font-size="14" letter-spacing="1">03 / MASTER COMPONENT</text>
    <text x="0" y="26" fill="#ffffff" class="font-jakarta bold" font-size="20">Component: Button (Variants &amp; States)</text>

    <!-- Large Size Row -->
    <g transform="translate(0, 50)">
      <text x="0" y="32" fill="#94a3b8" class="font-jakarta bold" font-size="12">SIZE: LG (48px)</text>
      <!-- Primary -->
      <g transform="translate(140, 0)">
        <rect width="140" height="48" rx="12" fill="url(#compBlue)"/>
        <text x="70" y="29" fill="#ffffff" class="font-jakarta semibold" font-size="14" text-anchor="middle">Primary LG</text>
      </g>
      <!-- Secondary -->
      <g transform="translate(300, 0)">
        <rect width="150" height="48" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
        <text x="75" y="29" fill="#ffffff" class="font-jakarta semibold" font-size="14" text-anchor="middle">Secondary LG</text>
      </g>
      <!-- Cyan Gradient -->
      <g transform="translate(470, 0)">
        <rect width="150" height="48" rx="12" fill="url(#compCyan)"/>
        <text x="75" y="29" fill="#ffffff" class="font-jakarta bold" font-size="14" text-anchor="middle">Cyan Gradient</text>
      </g>
      <!-- Outline -->
      <g transform="translate(640, 0)">
        <rect width="130" height="48" rx="12" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
        <text x="65" y="29" fill="#60a5fa" class="font-jakarta semibold" font-size="14" text-anchor="middle">Outline LG</text>
      </g>
    </g>

    <!-- Medium Size Row -->
    <g transform="translate(0, 115)">
      <text x="0" y="26" fill="#94a3b8" class="font-jakarta bold" font-size="12">SIZE: MD (40px)</text>
      <g transform="translate(140, 0)">
        <rect width="124" height="40" rx="10" fill="url(#compBlue)"/>
        <text x="62" y="25" fill="#ffffff" class="font-jakarta semibold" font-size="13" text-anchor="middle">Primary MD</text>
      </g>
      <g transform="translate(284, 0)">
        <rect width="134" height="40" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2"/>
        <text x="67" y="25" fill="#ffffff" class="font-jakarta semibold" font-size="13" text-anchor="middle">Secondary MD</text>
      </g>
      <g transform="translate(438, 0)">
        <rect width="134" height="40" rx="10" fill="url(#compCyan)"/>
        <text x="67" y="25" fill="#ffffff" class="font-jakarta bold" font-size="13" text-anchor="middle">Cyan MD</text>
      </g>
    </g>

    <!-- Small Size Row -->
    <g transform="translate(0, 175)">
      <text x="0" y="22" fill="#94a3b8" class="font-jakarta bold" font-size="12">SIZE: SM (32px)</text>
      <g transform="translate(140, 0)">
        <rect width="110" height="32" rx="8" fill="url(#compBlue)"/>
        <text x="55" y="20" fill="#ffffff" class="font-jakarta semibold" font-size="12" text-anchor="middle">+ Add to Cart</text>
      </g>
      <g transform="translate(270, 0)">
        <rect width="110" height="32" rx="8" fill="#ffffff" fill-opacity="0.08"/>
        <text x="55" y="20" fill="#cbd5e1" class="font-jakarta semibold" font-size="12" text-anchor="middle">Details</text>
      </g>
    </g>
  </g>

  <!-- Section 4: Master Component - Product Card -->
  <g transform="translate(60, 960)">
    <text x="0" y="0" fill="#60a5fa" class="font-jakarta bold" font-size="14" letter-spacing="1">04 / MASTER COMPONENT</text>
    <text x="0" y="26" fill="#ffffff" class="font-jakarta bold" font-size="20">Component: Product Card (Auto Layout Blueprint)</text>

    <g transform="translate(0, 50)">
      <!-- Rendered Card -->
      <g transform="translate(0, 0)">
        <rect width="320" height="470" rx="24" fill="url(#compCard)" stroke="#ffffff" stroke-opacity="0.1"/>
        <rect width="320" height="210" rx="24" fill="#101828"/>
        <rect x="16" y="16" width="76" height="22" rx="11" fill="#2563eb" fill-opacity="0.15" stroke="#60a5fa" stroke-opacity="0.4"/>
        <text x="54" y="31" fill="#93c5fd" class="font-jakarta bold" font-size="9" text-anchor="middle">BESTSELLER</text>
        <circle cx="160" cy="115" r="42" fill="#1e293b" stroke="#3b82f6" stroke-width="2.5"/>
        <g transform="translate(20, 235)">
          <text x="0" y="0" fill="#fbbf24" class="font-inter bold" font-size="12">★★★★★ 4.9 <tspan fill="#64748b">(1,248)</tspan></text>
          <text x="0" y="30" fill="#ffffff" class="font-jakarta bold" font-size="18">Smartwatch Pro</text>
          <text x="0" y="55" fill="#94a3b8" class="font-inter regular" font-size="13">AMOLED display, ECG monitoring &amp;</text>
          <text x="0" y="73" fill="#94a3b8" class="font-inter regular" font-size="13">14-day ultra long battery life.</text>
          <g transform="translate(0, 110)">
            <text x="0" y="16" fill="#ffffff" class="font-jakarta extrabold" font-size="22">$249.99</text>
            <text x="0" y="34" fill="#64748b" class="font-inter regular" font-size="13" text-decoration="line-through">$299.99</text>
            <g transform="translate(160, 0)">
              <rect width="120" height="40" rx="10" fill="url(#compBlue)"/>
              <text x="60" y="25" fill="#ffffff" class="font-jakarta semibold" font-size="13" text-anchor="middle">+ Add to Cart</text>
            </g>
          </g>
        </g>
      </g>

      <!-- Auto Layout Specifications Annotations -->
      <g transform="translate(370, 10)">
        <rect width="700" height="450" rx="16" fill="#162032" stroke="#60a5fa" stroke-opacity="0.3"/>
        <g transform="translate(30, 30)">
          <text x="0" y="0" fill="#38bdf8" class="font-jakarta bold" font-size="16">Figma Auto Layout Hierarchy &amp; Rules</text>
          
          <text x="0" y="35" fill="#ffffff" class="font-jakarta bold" font-size="14">Frame: Product Card</text>
          <text x="20" y="60" fill="#cbd5e1" class="font-inter regular" font-size="13">• Direction: Vertical (Column) | Alignment: Top Left | Gap: 0px</text>
          <text x="20" y="80" fill="#cbd5e1" class="font-inter regular" font-size="13">• Resizing: Width: Fill container (Grid) | Height: Hug contents (470px)</text>
          <text x="20" y="100" fill="#cbd5e1" class="font-inter regular" font-size="13">• Corner Radius: 24px | Stroke: 1px Inside (#FFFFFF 8%)</text>

          <text x="0" y="140" fill="#ffffff" class="font-jakarta bold" font-size="14">Sub-Frame: Thumbnail Area</text>
          <text x="20" y="165" fill="#cbd5e1" class="font-inter regular" font-size="13">• Direction: Horizontal (Center Center) | Height: Fixed 210px | Width: Fill container</text>
          <text x="20" y="185" fill="#cbd5e1" class="font-inter regular" font-size="13">• Absolute positioned Badge Stack at (16, 16)</text>

          <text x="0" y="225" fill="#ffffff" class="font-jakarta bold" font-size="14">Sub-Frame: Content Body</text>
          <text x="20" y="250" fill="#cbd5e1" class="font-inter regular" font-size="13">• Direction: Vertical (Column) | Padding: 20px all sides | Gap: 12px</text>
          <text x="20" y="270" fill="#cbd5e1" class="font-inter regular" font-size="13">• Resizing: Width: Fill container | Height: Hug contents</text>

          <text x="0" y="310" fill="#ffffff" class="font-jakarta bold" font-size="14">Sub-Frame: Footer Action Row</text>
          <text x="20" y="335" fill="#cbd5e1" class="font-inter regular" font-size="13">• Direction: Horizontal (Row) | Space-Between | Alignment: Center</text>
          <text x="20" y="355" fill="#cbd5e1" class="font-inter regular" font-size="13">• Price Wrap (Hug) + Button Instance (Hug)</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Section 5: Master Components - Category & Feature Cards -->
  <g transform="translate(60, 1540)">
    <text x="0" y="0" fill="#60a5fa" class="font-jakarta bold" font-size="14" letter-spacing="1">05 / REUSABLE CARDS</text>
    <text x="0" y="26" fill="#ffffff" class="font-jakarta bold" font-size="20">Category Card &amp; Feature Card Components</text>

    <g transform="translate(0, 50)">
      <!-- Category Card Component -->
      <g transform="translate(0, 0)">
        <rect width="220" height="230" rx="16" fill="url(#compCard)" stroke="#ffffff" stroke-opacity="0.08"/>
        <circle cx="110" cy="70" r="40" fill="#ffffff" fill-opacity="0.04"/>
        <circle cx="110" cy="70" r="24" stroke="#60a5fa" stroke-width="2.5" fill="#1e293b"/>
        <text x="110" y="145" fill="#ffffff" class="font-jakarta bold" font-size="16" text-anchor="middle">Smartwatches</text>
        <text x="110" y="170" fill="#94a3b8" class="font-inter regular" font-size="12" text-anchor="middle">24 Models</text>
        <text x="110" y="200" fill="#60a5fa" class="font-jakarta semibold" font-size="12" text-anchor="middle">Explore →</text>
      </g>

      <!-- Feature Card Component -->
      <g transform="translate(260, 0)">
        <rect width="360" height="230" rx="24" fill="url(#compCard)" stroke="#ffffff" stroke-opacity="0.08"/>
        <rect x="28" y="24" width="56" height="56" rx="16" fill="#2563eb" fill-opacity="0.2" stroke="#60a5fa" stroke-opacity="0.3"/>
        <path d="M48 52 L54 58 L64 48" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <text x="28" y="120" fill="#ffffff" class="font-jakarta bold" font-size="18">Premium Quality Products</text>
        <text x="28" y="150" fill="#94a3b8" class="font-inter regular" font-size="14">Every gadget undergoes a rigorous 12-point</text>
        <text x="28" y="172" fill="#94a3b8" class="font-inter regular" font-size="14">inspection with 2-year warranty.</text>
      </g>

      <!-- Testimonial Card Component -->
      <g transform="translate(660, 0)">
        <rect width="420" height="230" rx="24" fill="url(#compCard)" stroke="#ffffff" stroke-opacity="0.08"/>
        <text x="28" y="42" fill="#fbbf24" class="font-inter bold" font-size="14">★★★★★</text>
        <text x="28" y="78" fill="#cbd5e1" class="font-inter regular" font-size="14" font-style="italic">"The Smartwatch Pro exceeded all expectations.</text>
        <text x="28" y="100" fill="#cbd5e1" class="font-inter regular" font-size="14" font-style="italic">Battery easily lasts 12 days on heavy GPS tracking."</text>
        <circle cx="52" cy="170" r="22" fill="#1e3a8a"/>
        <text x="52" y="176" fill="#93c5fd" class="font-jakarta bold" font-size="13" text-anchor="middle">AC</text>
        <text x="86" y="165" fill="#ffffff" class="font-jakarta bold" font-size="15">Alex Chen <tspan fill="#38bdf8">✓</tspan></text>
        <text x="86" y="184" fill="#94a3b8" class="font-inter regular" font-size="12">Software Engineer &amp; Audio Buff</text>
      </g>
    </g>
  </g>

</svg>
